<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NT Yala Portal</title>
<style>
:root{--y:#FFC400;--c:#2b2b2b;--bg:#f5f5f2;--card:#fff;--mut:#777;--ok:#1a7f37;--err:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--c)}
header{background:var(--c);color:var(--y);padding:18px 16px;font-weight:700;font-size:18px}
header small{display:block;color:#ddd;font-weight:400;font-size:12px;margin-top:2px}
main{padding:16px;max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hello{font-size:16px}.hello b{font-size:18px}
.sys{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;border-left:6px solid var(--y)}
.sys .ic{font-size:28px}.sys .t{font-weight:700}.sys .d{font-size:13px;color:var(--mut)}
.sys.off{opacity:.45;pointer-events:none;border-left-color:#ccc}
.role{margin-left:auto;font-size:11px;background:#eee;border-radius:99px;padding:2px 8px}
.msg{text-align:center;padding:28px 16px}
.err{color:var(--err)}
button{background:var(--y);border:0;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:700;font-family:inherit}
footer{text-align:center;color:var(--mut);font-size:11px;padding:12px}
</style>
</head>
<body>
<header>NT ยะลา Portal<small>ระบบงานภายใน บตน.2 (ยล.)</small></header>
<main id="app"><div class="card msg">กำลังตรวจสอบตัวตน…</div></main>
<footer id="foot"></footer>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ===== ตั้งค่า (แก้ที่นี่ที่เดียว) ===== */
const CONFIG = {
  LIFF_ID: '2011665434-W1nRvf6K',
  CORE_API: 'https://script.google.com/macros/s/AKfycbwcBoeKlrt8n4yLoaqM0IsWYiWMTvk-ItcFNUZI6nu1Lz1vceADtb02BQ8STceyilPZfQ/exec',
  // ระบบที่แสดงบน Portal: key ต้องตรงกับคอลัมน์ "ระบบ" ในแท็บ สิทธิ์ระบบ (kpi / cgd)
  SYSTEMS: [
    { key: 'kpi', icon: '📊', name: 'KPI ผลงานรายบุคคล', desc: 'ดูคะแนนและผลงานภาคสนาม',
      url: 'https://liff.line.me/2011665434-rMbcebZR', needRole: false },
    { key: 'cgd', icon: '🎁', name: 'คลังของแจกลูกค้า', desc: 'เบิก/ตรวจสอบของที่ระลึก',
      url: 'https://ntyalacgd.netlify.app/', needRole: true }
  ]
};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show = h => app.innerHTML = h;
const fail = (t, d) => show(`<div class="card msg"><div class="err"><b>${esc(t)}</b></div><p>${esc(d||'')}</p><button onclick="location.reload()">ลองใหม่</button></div>`);

async function call(body){
  // text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง preflight (Apps Script ไม่รองรับ OPTIONS)
  const r = await fetch(CONFIG.CORE_API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  return r.json();
}

async function main(){
  if (CONFIG.LIFF_ID.startsWith('YOUR')) return fail('ยังไม่ได้ตั้งค่า LIFF ID', 'แก้ CONFIG.LIFF_ID ในไฟล์ index.html');
  await liff.init({ liffId: CONFIG.LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  const idToken = liff.getIDToken();
  if (!idToken) return fail('ไม่พบ ID token', 'ตรวจว่า LIFF เปิดสิทธิ์ scope openid แล้ว');
  let res;
  try { res = await call({ action:'login', idToken }); } catch(e){ return fail('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'ลองใหม่อีกครั้ง'); }
  if (!res.ok) {
    if (res.error === 'NOT_REGISTERED') return fail('ยังไม่ได้ลงทะเบียน', 'พิมพ์ลงทะเบียนในแชทบอท NT Yala แล้วรอ ผส. อนุมัติ จากนั้นเปิดหน้านี้ใหม่');
    if (res.error === 'TOKEN_EXPIRED') { liff.logout(); return liff.login({ redirectUri: location.href }); }
    return fail('เข้าสู่ระบบไม่สำเร็จ', 'รหัสข้อผิดพลาด: ' + res.error);
  }
  // เก็บ session ในหน่วยความจำเท่านั้น (ไม่ใส่ใน URL / ไม่เก็บถาวร)
  window.__session = res.session;
  const roles = res.roles || {};
  const cards = CONFIG.SYSTEMS.map(s => {
    const role = roles[s.key];
    const allowed = s.url && (!s.needRole || role);
    const why = !s.url ? 'เร็ว ๆ นี้' : (!allowed ? 'ยังไม่มีสิทธิ์ — ติดต่อ ผส.' : s.desc);
    const tag = role ? `<span class="role">${esc(role)}</span>` : '';
    return `<a class="card sys ${allowed?'':'off'}" ${allowed?`href="${esc(s.url)}"`:''}>
      <span class="ic">${s.icon}</span><span><div class="t">${esc(s.name)}</div><div class="d">${esc(why)}</div></span>${tag}</a>`;
  }).join('');
  show(`<div class="card hello">สวัสดี <b>${esc(res.user.name)}</b><br><small>${esc(res.user.center||'')} · รหัส ${esc(res.user.empId)}</small></div>${cards}`);
  document.getElementById('foot').textContent = 'เข้าสู่ระบบถึง ' + new Date(res.expiresAt*1000).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) + ' น.';
}
main().catch(e => fail('เกิดข้อผิดพลาด', String(e && e.message || e)));
</script>
</body>
</html>
